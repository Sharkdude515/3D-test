<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Bunker 11 - Solo</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050508;
            font-family: 'Courier New', Courier, monospace;
        }

        /* 3D Target Viewport Container */
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Heads Up Display Layout */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            color: #00ffaa;
            text-shadow: 0 0 8px rgba(0,255,170,0.6);
            font-size: 1.2rem;
            font-weight: bold;
            pointer-events: none;
        }
        .hud-panel {
            background: rgba(10, 15, 25, 0.7);
            padding: 10px 20px;
            border: 1px solid #00ffaa;
            border-radius: 4px;
        }
        #scrap-panel {
            color: #ffaa00; 
            border-color: #ffaa00;
        }
        #health-bar-container {
            width: 150px;
            height: 12px;
            border: 1px solid #ff3333;
            background: #200;
            display: inline-block;
            margin-left: 10px;
            vertical-align: middle;
        }
        #health-bar {
            width: 100%;
            height: 100%;
            background: #ff3333;
            box-shadow: 0 0 8px #ff3333;
            transition: width 0.3s;
        }

        /* Inventory Panel Overlay */
        #inventory-overlay {
            position: absolute;
            left: 20px;
            top: 100px;
            z-index: 10;
            color: #88aaff;
            background: rgba(10,15,25,0.7);
            border: 1px solid #4466aa;
            padding: 15px;
            border-radius: 4px;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        /* Bottom Controls Row */
        #controls-ui {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .mode-selector {
            background: rgba(10, 15, 25, 0.85);
            border: 1px solid #00aaff;
            padding: 8px 16px;
            border-radius: 4px;
            color: #00aaff;
            font-size: 0.9rem;
            letter-spacing: 2px;
        }
        .action-row {
            display: flex;
            gap: 10px;
        }
        .btn {
            background: #111a24;
            border: 1px solid #00ffaa;
            color: #00ffaa;
            padding: 12px 24px;
            font-family: inherit;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 5px rgba(0,255,170,0.2);
            transition: all 0.2s;
        }
        .btn:hover {
            background: #00ffaa;
            color: #000;
            box-shadow: 0 0 15px #00ffaa;
        }
        .btn:active {
            transform: scale(0.95);
        }
        #btn-fire { border-color: #ff3333; color: #ff3333; }
        #btn-radiation { border-color: #ffaa00; color: #ffaa00; }

        /* Game Over Layout overlay view */
        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(20, 0, 0, 0.9);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ff3333;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        #game-over-screen.active {
            visibility: visible;
            opacity: 1;
        }
        #game-over-screen h1 {
            font-size: 3.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 15px #ff0000;
            letter-spacing: 3px;
        }
        #game-over-screen p {
            font-size: 1.2rem;
            color: #ffaaaa;
            margin-bottom: 30px;
        }
        #btn-respawn { border-color: #ff3333; color: #ff3333; }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com"
            }
        }
    </script>
</head>
<body>

    <div id="hud">
        <div class="hud-panel">
            HEALTH: <div id="health-bar-container"><div id="health-bar"></div></div>
        </div>
        <div class="hud-panel">SCORE: <span id="score-val">0</span></div>
        <div class="hud-panel" id="scrap-panel">SCRAP: <span id="scrap-val">5</span></div>
    </div>

    <div id="inventory-overlay">
        <strong>STRUCTURE COUNTS:</strong><br>
        DOOR: <span id="count-door">0</span><br>
        HATCH: <span id="count-hatch">0</span><br>
        LADDER: <span id="count-ladder">0</span><br>
        SCAFFOLD: <span id="count-scaffold">0</span>
    </div>

    <div id="controls-ui">
        <div class="mode-selector">MODE: BUILD CRAFT SAVE LOAD</div>
        <div class="action-row">
            <button class="btn" id="btn-jump">Jump</button>
            <button class="btn" id="btn-fire">Fire</button>
            <button class="btn" id="btn-radiation">Take Rads</button>
        </div>
    </div>

    <div id="game-over-screen">
        <h1>GAME OVER</h1>
        <p>YOU DIED FROM RADIATION AND MUTANTS</p>
        <button class="btn" id="btn-respawn">RESPAWN</button>
    </div>

    <div id="canvas-container"></div>
    <script type="module">
        import * as THREE from 'three';

        // --- Core Memory Context States ---
        const state = {
            health: 100,
            score: 0,
            scrap: 5,
            inventory: { door: 0, hatch: 0, ladder: 0, scaffold: 0 },
            craftingCosts: { door: 3, hatch: 2, ladder: 1, scaffold: 2 }
        };

        // --- Core Engine Setup Configurations ---
        const container = document.getElementById('canvas-container');
        const craftableMeshes = [];
        const itemCatalog = [
            { id: 'door', color: 0xff3355, type: 'box', size: [0.8, 1.4, 0.15] },
            { id: 'hatch', color: 0x33ccff, type: 'box', size: [1.1, 0.15, 1.1] },
            { id: 'ladder', color: 0xffaa00, type: 'cylinder', size: [0.04, 0.04, 1.5] },
            { id: 'scaffold', color: 0x8888aa, type: 'box', size: [1.2, 1.2, 1.2] }
        ];

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050508, 0.15);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.2, 4);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const ambient = new THREE.AmbientLight(0x1a2430, 1.5);
        scene.add(ambient);

        const pointLight = new THREE.PointLight(0x00ffaa, 2, 15);
        pointLight.position.set(0, 3, 2);
        scene.add(pointLight);

        // Floor / Base Grid setup
        const floorGeo = new THREE.PlaneGeometry(20, 20);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x11151c, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -1;
        scene.add(floor);

        const grid = new THREE.GridHelper(20, 20, 0x00ffaa, 0x223344);
        grid.position.y = -0.99;
        scene.add(grid);

        // Instantiate Item Hologram Meshes
        const spacing = 1.6;
        const startX = -((itemCatalog.length - 1) * spacing) / 2;

        itemCatalog.forEach((item, index) => {
            let geo;
            if (item.type === 'box') geo = new THREE.BoxGeometry(...item.size);
            else if (item.type === 'cylinder') geo = new THREE.CylinderGeometry(item.size, item.size, item.size, 12);

            const mat = new THREE.MeshStandardMaterial({
                color: item.color,
                emissive: item.color,
                emissiveIntensity: 0.4,
                transparent: true,
                opacity: 0.85
            });

            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(startX + (index * spacing), 0.3, 0);
            mesh.userData = { id: item.id, initialY: 0.3 };
            
            scene.add(mesh);
            craftableMeshes.push(mesh);
        });
        // --- Interaction Input Triggers ---
        document.getElementById('btn-jump').addEventListener('click', () => {
            camera.position.y += 0.4; 
            state.score += 10;
            syncDomInterface();
        });

        document.getElementById('btn-fire').addEventListener('click', () => {
            const flash = new THREE.PointLight(0xff3333, 10, 30);
            flash.position.set(0, 1, 2);
            scene.add(flash);
            setTimeout(() => scene.remove(flash), 70);
            state.score += 25;
            syncDomInterface();
        });

        document.getElementById('btn-radiation').addEventListener('click', () => {
            state.health = Math.max(0, state.health - 20);
            syncDomInterface();
            if (state.health <= 0) document.getElementById('game-over-screen').classList.add('active');
        });

        document.getElementById('btn-respawn').addEventListener('click', () => {
            state.health = 100;
            state.scrap = 5;
            state.score = 0;
            Object.keys(state.inventory).forEach(k => state.inventory[k] = 0);
            document.getElementById('game-over-screen').classList.remove('active');
            syncDomInterface();
        });

        // Scene Interactive Raycast Ray Selection Controls
        const raycaster = new THREE.Raycaster();
        const cursor = new THREE.Vector2();

        window.addEventListener('click', (e) => {
            if (state.health <= 0) return;

            cursor.x = (e.clientX / window.innerWidth) * 2 - 1;
            cursor.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(cursor, camera);
            const interactions = raycaster.intersectObjects(craftableMeshes);

            if (interactions.length > 0) {
                const hitMesh = interactions[0].object;
                const targetId = hitMesh.userData.id;
                const moduleCost = state.craftingCosts[targetId];

                if (state.scrap >= moduleCost) {
                    state.scrap -= moduleCost;
                    state.inventory[targetId]++;
                    state.score += 100;
                    hitMesh.scale.set(1.3, 1.3, 1.3);
                    syncDomInterface();
                } else {
                    const nativeColor = hitMesh.material.color.getHex();
                    hitMesh.material.color.setHex(0xff0000);
                    setTimeout(() => hitMesh.material.color.setHex(nativeColor), 200);
                }
            }
        });
        function syncDomInterface() {
            document.getElementById('health-bar').style.width = `${state.health}%`;
            document.getElementById('score-val').innerText = state.score;
            document.getElementById('scrap-val').innerText = state.scrap;
            document.getElementById('count-door').innerText = state.inventory.door;
            document.getElementById('count-hatch').innerText = state.inventory.hatch;
            document.getElementById('count-ladder').innerText = state.inventory.ladder;
            document.getElementById('count-scaffold').innerText = state.inventory.scaffold;
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- Simulation Render Cycle Loop ---
        function runLoop(timestamp) {
            requestAnimationFrame(runLoop);

            if (camera.position.y > 1.2) camera.position.y -= 0.02;

            const time = timestamp * 0.0015 || 0;
            craftableMeshes.forEach((mesh, index) => {
                mesh.position.y = mesh.userData.initialY + Math.sin(time + index) * 0.08;
                mesh.rotation.y += 0.01;

                mesh.scale.x += (1.0 - mesh.scale.x) * 0.1;
                mesh.scale.y += (1.0 - mesh.scale.y) * 0.1;
                mesh.scale.z += (1.0 - mesh.scale.z) * 0.1;
            });

            renderer.render(scene, camera);
        }

        syncDomInterface();
        runLoop();
    </script>
</body>
</html>
